<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe0"/>
      <stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#sky)"/>
  <!-- the Skyway: a rainbow from the big island to the little one -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M86 132 Q150 58 206 120" stroke="#ff8fb1"/>
    <path d="M86 139 Q150 65 206 127" stroke="#ffd36e"/>
    <path d="M86 146 Q150 72 206 134" stroke="#8fe3b0"/>
    <path d="M86 153 Q150 79 206 141" stroke="#8fd0ff"/>
  </g>
  <!-- the little island -->
  <path d="M206 128 L230 140 L206 152 L182 140 Z" fill="#5fd6a8"/>
  <path d="M182 140 L206 152 L206 178 L182 166 Z" fill="#e0947c"/>
  <path d="M206 152 L230 140 L230 166 L206 178 Z" fill="#bb6f5c"/>
  <!-- the big island: a stack of grass blocks -->
  <path d="M84 118 L136 144 L84 170 L32 144 Z" fill="#5fd6a8"/>
  <path d="M32 144 L84 170 L84 226 L32 200 Z" fill="#e0947c"/>
  <path d="M84 170 L136 144 L136 200 L84 226 Z" fill="#bb6f5c"/>
  <path d="M32 144 L84 170 L84 178 L32 152 Z" fill="#46b88c"/>
  <path d="M84 170 L136 144 L136 152 L84 178 Z" fill="#3a9e78"/>
  <path d="M32 172 L84 198 L136 172" fill="none" stroke="#8e5245" stroke-width="2.5" opacity="0.5"/>
  <!-- the astronaut, round and white, waving from the top -->
  <ellipse cx="84" cy="146" rx="15" ry="5" fill="#1d2a55" opacity="0.25"/>
  <circle cx="84" cy="128" r="16" fill="#f4f8ff"/>
  <ellipse cx="89" cy="125" rx="8" ry="6" fill="#1d2a55"/>
  <ellipse cx="91" cy="123" rx="2.5" ry="2" fill="#ffffff"/>
  <!-- a star to find -->
  <path d="M150 30 L157.6 47.6 L176.6 49.3 L162.2 61.9 L166.5 80.5 L150 70.7 L133.5 80.5 L137.8 61.9 L123.4 49.3 L142.4 47.6 Z" fill="#ffd23f" stroke="#1d2a55" stroke-width="5" stroke-linejoin="round"/>
</svg>
